- quote: "3 words: AUTHENTIC DELICIOUS FOOD. Emi is a great cook and makes one of the best takoyaki in Singapore. Everything is made from scratch, including the sauce. It has become our comfort food and a sure win at any party. You will not regret ordering from her."
  quote_ja: "一言でいうと「本物の美味しさ」。Emiさんの料理の腕は確かで、シンガポールでも屈指の美味しいたこ焼きを作ってくれます。ソースまですべて手作り。我が家の定番になり、どんなパーティーでも大好評です。頼んで後悔しないはずです。"
  author: Cxxxxx Gxx
  rating: 5
  local_guide: true

- quote: "No regrets! Takoyaki was chewy and yummy and held up to delivery very well, not once turning soggy. It was such a hit we had to hide some trays first to save some for the rest."
  quote_ja: "後悔なし！たこ焼きはもちもちで美味しく、デリバリーでも一度もふやけることがありませんでした。あまりの人気で、みんなに配る前にいくつかのトレイを隠しておかなければならないほどでした。"
  author: Yxxxxxx Sxx
  rating: 5
  local_guide: true

- quote: "If you're tired of eating bad takoyaki in Singapore and want the real thing at the same prices, try Emi's takoyaki! Great texture and flavor just like what you can get in Japan."
  quote_ja: "シンガポールでイマイチなたこ焼きに飽きたなら、同じ価格で本物を味わえるEmiさんのたこ焼きをぜひ。食感も味も、日本で食べるものそのものです。"
