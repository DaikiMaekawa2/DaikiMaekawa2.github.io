    title: 'Real Japan,<br><strong><em>Right here.</em></strong>'
    lead: >-
      Nyanmeshi JAPAN brings the taste of a Japanese <em>Matsuri</em> to
      Singapore's pasar malams, malls and festivals. Takoyaki and festival
      favourites, cooked to order by a Japanese-run team.
