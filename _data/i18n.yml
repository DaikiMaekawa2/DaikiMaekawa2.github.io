  story:
    subtitle: Our Heritage
    title: Japanese Authenticity,<br>Singaporean Foundation.
    p1: >-
      Nyanmeshi JAPAN was founded with a mission to bring the vibrant,
      authentic atmosphere of a Japanese <em>Matsuri</em> (festival) to the
      doorsteps of local communities.
    p2: >-
      As a Japanese-managed firm based in Singapore, our core team acts as a
      specialized content engine. By sourcing high-quality tenants directly
      from Japan, vetting authentic regional products, and maintaining rigorous
      operational standards, we ensure that every event is executed with
      precision and <em>Omotenashi</em> (hospitality).
    p3: >-
      Our vision is to be the most reliable bridge between Japanese culinary
      traditions and event organizers, providing our partners with seamless,
      high-performance F&amp;B solutions that shoppers love — proven across
      Singapore, and from August 2026, in Malaysia.
