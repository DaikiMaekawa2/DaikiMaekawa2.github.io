    subtitle: 販売・出店実績
    title: 出店の軌跡
  menu:
    subtitle: 屋台の味
    title: 看板メニュー
    signature_tag: 名物
    footnote: すべてのメニューを、日本の縁日と同じように屋台で一品ずつ調理しています。
