    title: '日本の<strong>祭の味</strong>を、<br>シンガポールで。'
    lead: "百貨店催事、銀行ロードショー、パサマラム（夜市）。シンガポール全域で日本の食を売り続けてきました。2026年8月にはマレーシアにも出店しました。御社の商品の海外販路づくりを、現地からお手伝いします。"
