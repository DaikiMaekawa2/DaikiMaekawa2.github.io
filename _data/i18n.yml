        title: 食イベントの企画・運営
        desc: 日本食フェスティバルの企画から実施までを一貫してサポート。文化と食の「本物」をお約束します。
      - icon: "🎪"
        title: 仮設ブース・商品調達
        desc: 機動力の高いキッチン設営と、日本の地域テナント・本物の商品への直接アクセスをご提供します。
      - icon: "🍜"
        title: パサマラム出店
        desc: 日本の屋台文化とシンガポールの夜市文化の架け橋として、ハートランド各地を巡回出店しています。
      - icon: "🤝"
        title: ブランドパートナーシップ
        desc: オタフクソースをはじめとする日本の有名ブランドと連携し、スポンサードイベントを展開しています。
