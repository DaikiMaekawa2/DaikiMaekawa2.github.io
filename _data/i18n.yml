  story:
    subtitle: 私たちの原点
    title: 日本の本物を、<br>シンガポールから。
    p1: "Nyanmeshi JAPANは、日本の<em>祭</em>の活気あふれる本物の雰囲気を、地域の皆さまの身近にお届けすることを使命として設立されました。"
    p2: "シンガポールを拠点とする日本人経営の企業として、日本から直接質の高いテナントを誘致し、本物の地域産品を厳選。徹底した運営基準のもと、すべてのイベントを<em>おもてなし</em>の心で実施しています。"
    p3: "私たちのビジョンは、日本の食文化とイベント主催者をつなぐ最も信頼される架け橋となること。シンガポール全土での実績を重ね、2026年8月にはマレーシアにも初出店します。"
