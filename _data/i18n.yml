  story:
    subtitle: 私たちの原点
    title: 日本の本物を、<br>シンガポールから。
    p1: "Nyanmeshi JAPANは、日本の<em>祭</em>の本物の味と熱気を海外の生活者へ届けるため、シンガポールに設立された日本人経営の企業です。"
    p2: "私たちは、日本の作り手と海外市場をつなぐ「現地の売り場」です。日本からの質の高いテナント誘致、本物の地域産品の厳選、そして徹底した衛生・運営基準。御社の商品が売れる環境を、現地で整えます。"
    p3: "シンガポール全土での販売実績を土台に、2026年8月にはマレーシアへも進出しました。海外販路を求める日本ブランドにとって、最も信頼される架け橋となることが私たちのビジョンです。"
  proof:
    subtitle: 私たちの強み
    title: 本物の日本を、現地で。
  reach:
    subtitle: 展開エリア
    title: シンガポール全域で売り、<br>マレーシアでも実績。
    lead: シンガポールの全5地域で販売してきました。オーチャードの百貨店から住宅街の夜市まで、売り場ごとに何が売れるかを現場で知っています。2026年8月にはクアラルンプールにも進出。両市場での販売経験を、御社の商品の売り方に活かします。
    map_aria: Nyanmeshi JAPANが出店してきたシンガポール全5地域を示す地図
