  meta:
    tagline: 日本ブランドの海外展開パートナー
    description: "Nyanmeshi JAPAN PTE. LTD.は、シンガポール全土の百貨店催事・銀行ロードショー・夜市で日本の食を販売する日本人経営の専門企業です。日本の食品メーカー・ブランドの海外展開を現地で支援します。"
