  story:
    subtitle: 私たちの原点
    title: 日本の本物を、<br>シンガポールから。
    p1: "Nyanmeshi JAPANは、日本の<em>祭</em>の本物の味と熱気を海外の生活者へ届けるため、シンガポールに設立された日本人経営の企業です。"
    p2: "私たちは、日本の作り手と海外市場をつなぐ「現地の売り場」です。日本からの質の高いテナント誘致、本物の地域産品の厳選、そして徹底した衛生・運営基準。御社の商品が売れる環境を、現地で整えます。"
    p3: "シンガポール全土での販売実績を土台に、2026年8月にはマレーシアへ。海外販路を求める日本ブランドにとって、最も信頼される架け橋となることが私たちのビジョンです。"
