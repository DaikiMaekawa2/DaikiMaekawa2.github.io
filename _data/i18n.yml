    lead: "百貨店の催事から銀行ロードショー、地元のパサマラム（夜市）まで。Nyanmeshi JAPANは、忘れられない食体験をお届けする日本食イベントの専門パートナーです。2026年8月には、マレーシアにも初出店します。"
