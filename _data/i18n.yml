    title: なぜ、Nyanmeshi JAPANなのか
    cards:
      - icon: "🛍️"
        title: 現地で売り切る力
        desc: 2026年だけで9催事・のべ120日以上の販売実績。百貨店催事から夜市まで、シンガポール全域で日本の味を売り続けています。
      - icon: "🌏"
        title: 東南アジア市場への入り口
        desc: シンガポールを起点に、2026年8月からはマレーシアへ。成長する東南アジアでのテストマーケティングの場をご提供します。
      - icon: "✅"
        title: 許認可も運営も、現地で一貫対応
        desc: SFAライセンス取得済み。会場確保から設営・販売・衛生管理まで、日本語で相談できる現地チームが対応します。
