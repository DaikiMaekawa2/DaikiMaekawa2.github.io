        desc: Department stores, festivals, malls and night markets in every region of Singapore, plus a department-store <em>Matsuri</em> in Kuala Lumpur. We show up, and we draw.
      - icon: "🎌"
        title: An Authentic Content Engine
        desc: Tenants and regional products sourced directly from Japan, so your venue gets a real <em>Matsuri</em>, not a lookalike.
      - icon: "✅"
