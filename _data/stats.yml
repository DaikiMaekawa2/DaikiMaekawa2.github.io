# "By the numbers" band (the first three also form the hero proof line).
# Every figure must be all-time, so no two can contradict each other (an
# activation count was dropped for that reason: all-time it can never be
# below the venue count). EVERGREEN by design: each figure is a floor ("+")
# with no year in its label, so it stays true as the business grows and
# never needs a deadline-driven update. Bump a floor only when you want to;
# never claim more than the ledger supports (scripts/ledger_stats.py
# prints the current public totals).
- value: 25
  suffix: "+"
  label: Event venues served
  label_ja: 販売会場数

- value: 180
  suffix: "+"
  label: Stall-days served
  label_ja: のべ屋台営業日数

- value: 2
  suffix: ""
  label: Countries served
  label_ja: 出店国数
