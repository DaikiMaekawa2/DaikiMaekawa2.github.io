<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nyanmeshi JAPAN | Coming Soon</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #e63946; 
            --bg-color: #fdfcfb;
            --text-color: #2b2d42;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Poppins', 'Noto Sans JP', sans-serif;
            text-align: center;
        }

        .container {
            padding: 20px;
            max-width: 600px;
            animation: fadeIn 1.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .logo span {
            color: var(--primary-color);
        }

        h1 {
            font-size: 1.1rem;
            font-weight: 400;
            margin-bottom: 40px;
            letter-spacing: 1px;
            color: #8d99ae;
        }

        .status-badge {
            background: #fff1f2;
            color: var(--primary-color);
            padding: 8px 24px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 25px;
            border: 1px solid #ffccd5;
            text-transform: uppercase;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.8;
            color: #4a4e69;
            font-weight: 300;
        }

        footer {
            position: absolute;
            bottom: 40px;
            width: 100%;
            font-size: 0.75rem;
            color: #adb5bd;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="status-badge">Preparing Something Delicious</div>
        <div class="logo">NYAN<span>MESHI</span></div>
        <h1>Nyanmeshi JAPAN PTE. LTD.</h1>
        
        <p>Our digital home is currently under construction.<br> 
        Bringing authentic Japanese flavors to Singapore soon.</p>
    </div>

    <footer>
        &copy; 2026 NYANMESHI JAPAN PTE. LTD.
    </footer>

</body>
</html>
